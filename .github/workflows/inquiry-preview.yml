name: Validate inquiry preview
on:
  push:
    branches: [codex/inquiry-next]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inquiry-validation
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/codex/inquiry-next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:walkable
      - run: npm run build
        env:
          VITE_BASE_PATH: /vr-snow/preview/inquiry/
      - run: node scripts/test-web-app.mjs dist /vr-snow/preview/inquiry/
