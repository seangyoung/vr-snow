name: Validate walkable prototype

on:
  push:
    branches: [walkable-prototype]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build walkable preview
        env:
          VITE_BASE_PATH: /vr-snow/walkable/
        run: npm run build
