<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>The Broad Street Inquiry has moved</title>
    <script>
      // Keep old bookmarks and installed launch URLs working after promotion to main.
      const destination = new URL('../', window.location.href);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    </script>
  </head>
  <body>
    <p>The walkable experience is now the main app. <a href="../">Open The Broad Street Inquiry</a>.</p>
  </body>
</html>
